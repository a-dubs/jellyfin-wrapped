# Enable output filtering
AddOutputFilterByType SUBSTITUTE text/html

# Define environment variable substitution
# NOTE: JELLYFIN_API_KEY is no longer injected - it's kept server-side only!
<Location />
    # Only inject JELLYFIN_SERVER_URL if set (API key is handled by backend)
    <If "-n env('JELLYFIN_SERVER_URL')">
        Substitute "s|<head>|<head><script>window.ENV = { JELLYFIN_SERVER_URL: '${JELLYFIN_SERVER_URL}' };</script>|ni"
    </If>
    # Optionally inject BACKEND_API_URL if different from default /api
    <If "-n env('BACKEND_API_URL')">
        Substitute "s|window.ENV = {|window.ENV = { BACKEND_API_URL: '${BACKEND_API_URL}',|ni"
    </If>
</Location>
